services:
  festo:
    image: easyfetch-app:1.0
    platform: linux/amd64
    pull_policy: never
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://smartenance:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/smartenance
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    platform: linux/amd64
    pull_policy: never
    environment:
      POSTGRES_DB: smartenance
      POSTGRES_USER: smartenance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartenance -d smartenance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
